name: flutter_hyphenation
description: "HyphenText, a drop-in replacement for Flutter's Text that hyphenates long words correctly using TeX hyphenation patterns."
version: 1.0.2
repository: https://github.com/arxdeus/hyphenation/tree/main/packages/flutter_hyphenation
issue_tracker: https://github.com/arxdeus/hyphenation/issues
homepage: https://github.com/arxdeus/hyphenation
topics:
  - text
  - typography
  - hyphenation

environment:
  sdk: ^3.5.0
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  hyphenation: ^1.0.2

dev_dependencies:
  bench_press: ^0.3.0
  flutter_test:
    sdk: flutter
